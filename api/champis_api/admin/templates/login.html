{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="container-tight">
  <form class="card card-md" method="post" action="/admin/login">
    <div class="card-body">
      {% if error %}{{ m.alert("error", error) }}{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="key">Clé du backoffice</label>
        <input class="form-control{{ ' is-invalid' if error }}" id="key" name="key" type="password" autocomplete="current-password" required autofocus>
      </div>
      <button class="btn btn-primary w-100" type="submit">Entrer</button>
    </div>
  </form>
</div>
{% endblock %}
