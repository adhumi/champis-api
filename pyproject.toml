[project]
name = "champis"
version = "0.1.0"
description = "Champis — cartes de cueillette de champignons (monorepo : pipeline terrain, API météo, site)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "champis-pipeline",
    "champis-api",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pipeline", "api"]

[tool.uv.sources]
champis-pipeline = { workspace = true }
champis-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "api/tests"]
addopts = "-q"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
