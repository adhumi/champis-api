# CI : lint, format, tests, vecteurs de parité, fichiers espèces. Tout tourne sans réseau
# (fixtures synthétiques), donc rien à mocker : un échec ici est un vrai échec.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Le jeton par défaut ne fait que lire le dépôt (14 nov. 2026) ; le déploiement passe par
# RAILWAY_TOKEN, pas par lui. Les actions sont épinglées par SHA complet, le tag en commentaire :
# un tag se déplace, pas un commit (`git ls-remote https://github.com/<action> 'refs/tags/v*'`).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      # Le référentiel adhumi/champis est le sous-module champis/ ; tant qu'il est privé, le jeton
      # par défaut ne le lit pas : CHAMPIS_REFERENTIEL_TOKEN (jeton à granularité fine, lecture du
      # contenu de adhumi/champis seulement). Une fois le dépôt public, le secret devient inutile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le jeton du référentiel ne voit que adhumi/champis : il ne sert qu'au sous-module, par une
      # réécriture d'URL limitée à ce dépôt (le dépôt courant est cloné avec le jeton par défaut).
      - name: Référentiel (sous-module champis/)
        run: |
          # .gitmodules pointe sur l'URL SSH (postes de dev) : la CI, sans clé SSH, la réécrit en
          # HTTPS, avec le jeton du référentiel s'il y en a un, sinon en clair (dépôt public).
          if [ -n "$REFERENTIEL_TOKEN" ]; then
            git config --global url."https://x-access-token:${REFERENTIEL_TOKEN}@github.com/adhumi/champis.git".insteadOf "git@github.com:adhumi/champis.git"
          else
            git config --global url."https://github.com/adhumi/champis.git".insteadOf "git@github.com:adhumi/champis.git"
          fi
          git submodule update --init --depth 1 champis
          git -C champis log --oneline -1
        env:
          REFERENTIEL_TOKEN: ${{ secrets.CHAMPIS_REFERENTIEL_TOKEN }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --group dev --locked

      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (couverture ≥ 90 % du pipeline et de l'API)
        run: uv run pytest --cov=champis_pipeline --cov=champis_api --cov-report=term --cov-fail-under=90

      - name: Vecteurs de parité à jour
        run: uv run champis-vectors --check

      - name: Fichiers espèces
        run: uv run python champis/species/validate.py

  # Railway ne récupère pas les sous-modules (build depuis un instantané sans .git) : la CI, qui a le
  # référentiel, déploie l'API, les deux crons et le service d'exécution avec `railway up` après des tests verts sur main, ou
  # à la main depuis main (workflow_dispatch). RAILWAY_TOKEN : jeton de projet Railway (environnement production).
  deploy:
    needs: python
    # push sur main, ou lancement à la main depuis main seulement : une autre branche ne se
    # déploie pas en production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # l'API : on suit le build et le déploiement (--ci) ; les crons ne tournent qu'à leur heure,
        # on dépose l'image sans attendre (--detach)
        include:
          - service: champis
            mode: --ci
          - service: champis-warm
            mode: --detach
          - service: champis-notify
            mode: --detach
          - service: champis-jobs
            mode: --detach
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le jeton du référentiel ne voit que adhumi/champis : il ne sert qu'au sous-module, par une
      # réécriture d'URL limitée à ce dépôt (le dépôt courant est cloné avec le jeton par défaut).
      - name: Référentiel (sous-module champis/)
        run: |
          # .gitmodules pointe sur l'URL SSH (postes de dev) : la CI, sans clé SSH, la réécrit en
          # HTTPS, avec le jeton du référentiel s'il y en a un, sinon en clair (dépôt public).
          if [ -n "$REFERENTIEL_TOKEN" ]; then
            git config --global url."https://x-access-token:${REFERENTIEL_TOKEN}@github.com/adhumi/champis.git".insteadOf "git@github.com:adhumi/champis.git"
          else
            git config --global url."https://github.com/adhumi/champis.git".insteadOf "git@github.com:adhumi/champis.git"
          fi
          git submodule update --init --depth 1 champis
          git -C champis log --oneline -1
        env:
          REFERENTIEL_TOKEN: ${{ secrets.CHAMPIS_REFERENTIEL_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Le binaire vient d'une release GitHub : un 504 passager (vu le 9 nov. 2026, deux fois de
      # suite sur champis-warm) ne doit pas laisser un service sur une ancienne image.
      # Un essai raté laisse un paquet à moitié posé (le lanceur sans binaire : « Permission
      # denied » à railway up, vu le 9 nov. à 08:07Z) : on le retire avant de réessayer, et seule
      # une CLI qui répond compte comme installée.
      - name: Railway CLI
        run: |
          for i in 1 2 3 4; do
            if npm install -g "@railway/cli@${RAILWAY_CLI_VERSION}" && railway --version; then exit 0; fi
            npm uninstall -g @railway/cli >/dev/null 2>&1 || true
            echo "installation de la CLI Railway refusée (essai $i), nouvel essai dans $((i * 15)) s"
            sleep $((i * 15))
          done
          exit 1
        env:
          # version fixe (14 nov. 2026) : la CLI tient le jeton du projet, on ne prend pas la
          # dernière parue sans l'avoir choisie ; à relever ici, à la main
          RAILWAY_CLI_VERSION: "5.74.0"

      # Empreinte du déploiement, lue par le backoffice (page Santé) : sha court et date UTC
      - name: Empreinte du build
        run: echo "${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)" > BUILD

      # sans remote GitHub, la CLI envoie l'arbre de travail, sous-module compris
      - name: Déploiement (${{ matrix.service }})
        run: |
          git remote remove origin
          railway up ${{ matrix.mode }} --service ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
